server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退：未命中静态资源时交给 index.html（客户端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物（main.dart.js / assets / 字体等）长缓存、不可变
    location ~* \.(js|mjs|css|json|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HLS 直播/点播切片不缓存，保证实时性
    location ~* \.(m3u8|ts|aac)$ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # gzip 压缩（文本类资源显著减小首屏体积）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;
    gzip_proxied any;

    # 基础安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 放开请求体上限（封面/离线包上传等）
    client_max_body_size 0;
}
