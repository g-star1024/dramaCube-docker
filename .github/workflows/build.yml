name: build-web-image

# 剧立方 DramaCube — Flutter Web 镜像构建（路线 B）
# 流程：checkout 本仓（Dockerfile/nginx.conf）→ checkout 私有源码仓 hongguo-desktop
#       → Flutter 构建 web 产物 → 预置 hls.js → docker build → 推送 GHCR。
# 本工作流只读源码仓、不改源码；产物仅在本仓临时构建上下文内使用。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本 tag（如 2.7.83），用于镜像 :vX.Y.Z；留空则只推 :latest"
        required: false
        default: ""
      source_ref:
        description: "私有源码仓 hongguo-desktop 的 ref（分支名或 commit），默认 main"
        required: false
        default: "main"
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/g-star1024/dramacube-docker

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout 本仓（Dockerfile / nginx.conf）
        uses: actions/checkout@v4

      - name: Checkout 私有源码仓 hongguo-desktop（仅构建 web 产物，不修改）
        uses: actions/checkout@v4
        with:
          repository: g-star1024/hongguo-desktop
          token: ${{ secrets.SOURCE_TOKEN }}
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          path: source
          persist-credentials: false

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter 依赖
        working-directory: source
        run: flutter pub get

      - name: 构建 Web（release）
        working-directory: source
        run: flutter build web --release

      - name: 准备 Docker 构建上下文（复制 web 产物 + 预置 hls.js）
        run: |
          set -euo pipefail
          mkdir -p build
          rm -rf build/web
          cp -r source/build/web build/web
          # 预置 hls.js：供 web 播放层按需加载（原生端不受影响）
          curl -fsSL https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js -o build/web/hls.min.js

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"
          TAG="${{ github.event.inputs.version }}"
          if [ -n "$TAG" ]; then
            docker tag "$IMAGE:latest" "$IMAGE:v$TAG"
            docker push "$IMAGE:v$TAG"
            echo "已推送 $IMAGE:latest 与 $IMAGE:v$TAG"
          else
            echo "已推送 $IMAGE:latest（未提供 version，跳过版本 tag）"
          fi
